<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tip Calculator</title>
        <link rel="stylesheet" href="tip.css">
    </head>
    <body>
        <h1>Tip Calculator</h1>
        <div id="tipCalculator">
            <label for="billAmount">Bill Amount:</label>
            <input type="number" id="billAmount" placeholder="Enter bill amount">
            
            <label for="tipPercentage">Tip Percentage:</label>
            <input type="number" id="tipPercentage" placeholder="Enter tip percentage">

            <label for="splitCount">Number of People:</label>
            <input type="number" id="splitCount" placeholder="Enter number of people">
            <h2 id="result"></h2> 
ß 
         
            
            <button id="calculateButton">Calculate Tip</button>
        <h3> Bill Split</h3>
        <div id="billSplit">
            <label for="billSplit">Bill Split:</label>
            <input type="number" id="billSplit" placeholder="Enter bill split">
            <label for="numberOfPeople">Number of People:</label>   
            <input type="number" id="numberOfPeople" placeholder="Enter number of people">

    
            
            <h4 id="resultBill"></h4>
            <button id="calculateBillSplit">Calculate Bill Split</button>
        </div>
        <script src="tip.js"></script>s
    </body>
</html>
